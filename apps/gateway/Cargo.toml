[package]
name = "relay-gateway"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
description = "Ultra-low-latency LLM proxy data plane"
# `benches/harness.rs` is a helper module (`mod harness;` in proxy_latency.rs),
# not a benchmark in its own right. Without this, Cargo auto-discovers it as a
# second bench target and compiles it twice on every `cargo bench` and
# `cargo clippy --all-targets`.
autobenches = false

[dependencies]
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
axum.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
thiserror.workspace = true
clap.workspace = true
uuid.workspace = true
url.workspace = true
anyhow.workspace = true
futures-util.workspace = true
protocol-core = { path = "../../crates/protocol-core" }
workflow-schema = { path = "../../crates/workflow-schema" }
workflow-runtime = { path = "../../crates/workflow-runtime" }
arc-swap = "1.9"

[dev-dependencies]
criterion.workspace = true
# `tower::ServiceExt` is used only by `#[cfg(test)] mod tests` in src/server/mod.rs.
tower.workspace = true
mock-upstream = { path = "../../crates/mock-upstream" }
test-harness = { path = "../../crates/test-harness" }

[lints]
workspace = true

[[bench]]
name = "proxy_latency"
harness = false