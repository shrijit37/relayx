name: Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base branch (e.g. main)'
        required: true
        default: 'main'
      head_sha:
        description: 'Head commit SHA to review'
        required: true
      pr_number:
        description: 'Pull request number'
        required: true

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/review') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: code-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Open Code Review
        # Pin to a full commit SHA (supply-chain hardening), matching the
        # SHA-pinning practice for third-party actions in ci.yml.
        uses: alibaba/open-code-review@f1101fd7f51304c82e4a4f292bbee88aea0823cf
        with:
          llm_url: https://gateway.shrijit.tech/v1
          # The action only accepts the token via a `with:` input; GitHub
          # masks the secret value in logs. Trust is placed in the
          # SHA-pinned action above.
          llm_auth_token: ${{ secrets.GATEWAY_AUTH_TOKEN }}
          llm_model: big-pickle
          llm_use_anthropic: true
          language: English
          effort: high
          stream_progress: 'false'
          sticky_summary: 'true'
          incremental: 'true'
          base_ref: ${{ inputs.base_ref || '' }}
          head_sha: ${{ inputs.head_sha || '' }}
          pr_number: ${{ inputs.pr_number || '' }}
