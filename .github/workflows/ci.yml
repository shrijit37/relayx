name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Rust policy
        run: ./.claude/hooks/check-rust-policy.sh --all

      # `--locked` everywhere: CI must fail on a stale Cargo.lock rather than
      # silently re-resolving it (the committed lock is the build input).
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features --workspace -- -D warnings

      - name: Test
        run: cargo test --locked --all-features --workspace

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Repo-wide `bun run lint` has ~7k pre-existing prettier violations;
      # gate on the PR's files only (a full prettier sweep is tracked as follow-up).
      - name: Lint (changed files)
        run: |
          base="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          mapfile -t changed < <(git diff --name-only "$base"...HEAD -- '*.ts' '*.tsx' || true)
          if [ ${#changed[@]} -gt 0 ]; then
            bunx eslint "${changed[@]}"
          fi

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  # The declared MSRV is `workspace.package.rust-version` (1.88) and every member
  # inherits it. Nothing else verifies that claim: the `rust` job runs the current
  # stable toolchain, so an accidental dependency or language-feature bump past
  # 1.88 would only surface for downstream users. `+1.88.0` is explicit because
  # rust-toolchain.toml pins `channel = "stable"`, which overrides `rustup default`.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: msrv-1.88

      - name: Check on MSRV
        run: cargo +1.88.0 check --locked --all-features --workspace

  # The control plane is the other half of the publish pipeline (and owns the
  # Postgres schema); without this job its typecheck, lockfile and 40 integration
  # tests — counts published in docs/state.md — were never executed in CI.
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/control-plane
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relayx
          POSTGRES_PASSWORD: relayx-dev
          POSTGRES_DB: relayx
        # Port 5433 matches the RELAYX_PG_PORT default the app and tests read
        # (apps/control-plane/src/db/db.ts).
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U relayx -d relayx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Computes test/route counts from the source and fails when the docs
      # disagree, when a relative doc link breaks, when a snapshot is left at
      # docs/ top level, or when a living doc loses its convention header.
      # Static counting only — no Rust or Bun toolchain required.
      - name: Documentation truth
        run: scripts/verify-docs.sh
