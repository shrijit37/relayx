[workspace]
resolver = "2"
members = [
    "apps/gateway",
    "crates/mock-upstream",
    "crates/test-harness",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
# Runtime
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["time"] }
hyper = { version = "1.11", features = ["http1", "server", "client", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
axum = { version = "0.8", features = ["tokio", "http1", "json"] }
tower = { version = "0.5", features = ["util", "timeout", "limit", "load-shed", "buffer"] }
tower-http = { version = "0.7", features = ["trace", "request-id"] }
bytes = "1"
libc = "=0.2.165"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Errors / CLI / misc
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
uuid = { version = "1.26", features = ["v4"] }
url = { version = "2", features = ["serde"] }
anyhow = "1"
futures-util = "0.3"

# Dev
criterion = "0.8"
proptest = "1"

[workspace.lints.rust]
dead_code = "deny"